modLoader = "javafml"
loaderVersion = "[47,)"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/reliqwq/NeoECOPrototype1201/issues"

[[mods]]
modId = "neoecoprototype1201"
# Single source of truth: gradle.properties' mod_version is expanded into this line by
# processResources (see build.gradle). Writing the number here by hand would silently ship a jar
# whose metadata disagrees with its file name.
version = "${mod_version}"
displayName = "Neo ECO Prototype (1.20.1)"
authors = "reliqwq"
description = "L1 early-game tier for Neo ECO AE Extension, on Minecraft 1.20.1: the storage, computation and crafting subsystems, the processor assembler, and six storage-matrix families."

[[dependencies.neoecoprototype1201]]
    modId = "forge"
    mandatory = true
    versionRange = "[47.4.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.neoecoprototype1201]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.20.2)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.neoecoprototype1201]]
    modId = "ae2"
    mandatory = true
    versionRange = "[15.4.10,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.neoecoprototype1201]]
    modId = "neoecoae"
    mandatory = true
    # The floor is the compile baseline, on purpose: this line is compiled against the published
    # 20.5.3 jar, and earlier 20.5.x builds do not carry the storage API it uses.
    versionRange = "[20.5.3,)"
    ordering = "AFTER"
    side = "BOTH"
