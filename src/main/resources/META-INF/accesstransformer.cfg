# PoweredInterfaceScreen moves the second row of each slot section down to line the clickable slots up with
# the grooves the interface panel draws, which means writing Slot.y. On this engine the field is public final;
# AE2 strips that final for its own slot layout, and this asks javac for the same two so we are not borrowing
# a permission we cannot see at compile time.
# SRG names, not the official ones: ForgeGradle applies this file to the SRG-named MC jar before it renames to
# the mapping channel (measured here - build/_atJar_4/log.txt names forge-...-injected.jar as --inJar, and
# javap of that jar has f_40220_/f_40221_). Official names match nothing, and the AT step says nothing about
# it; the reading is javac's "final variable y" error coming back.
# A line that is only "#" is not a comment to this parser - it is an entry, and the build dies on it.
public-f net.minecraft.world.inventory.Slot f_40220_ # x
public-f net.minecraft.world.inventory.Slot f_40221_ # y
