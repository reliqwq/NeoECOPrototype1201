plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

// Porting aid: javac's default 100-error ceiling hides the rest of the gap list, so progress
// between compile runs cannot be measured.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

base {
    archivesName = 'neoecoprototype1201'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
        // Modrinth publishes bare jars with no POM; without artifact() the original never
        // resolves, and ForgeGradle then cannot produce the _mapped_official_ variant.
        metadataSources {
            mavenPom()
            artifact()
        }
    }

    // Pinned-file fallback. Modrinth's maven layout resolves <slug>/<version> to one
    // arbitrary file of that version, and byte counts show it is not always the 1.20.1 forge
    // build: jei 15.59.0.212 is 1 849 781 B through the maven but 1 826 038 B as the forge
    // file, and mezzconfig 0.6.10's maven copy declares minecraft [1.19.2,1.19.2] - Forge then
    // refuses to launch. This pattern walks the CDN path and names the file, so what we resolve
    // is what we checked.
    ivy {
        name = 'ModrinthFiles'
        url = 'https://cdn.modrinth.com/data'
        patternLayout { artifact '[organisation]/versions/[revision]/[module].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'u6dRKJwZ'; includeGroup 'UhW5uCKw' }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Published mods carry SRG-named refmaps; the dev environment runs on official names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            // Dev runs put our classes on the classpath instead of loading this project's jar, so the
            // MixinConfigs manifest attribute above is never read here. Mixin's own command line option
            // reaches the same registration - MixinPlatformManager.prepare() calls Mixins.addConfiguration()
            // for every --mixin.config value it finds on sun.java.command.
            args '--mixin.config', 'neoecoprototype1201.mixins.json'
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // eco's published 1.20.1 build. It is reobfuscated for production, so it needs the same
    // fg.deobf trip as every other mod here to line up with the 'official' mappings channel above.
    implementation fg.deobf("maven.modrinth:neoecoae:${eco_version}")

    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")

    compileOnly("org.appliedenergistics:guideme:${guideme_version}:api")
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    // eco's mods.toml makes LDLib v1 mandatory. Registrate does not belong here: the published eco
    // jar already carries its own copy via jarJar (MC1.20-1.3.11), and a second one on the module
    // path is a duplicate-package ResolutionException at boot.
    // compileOnly as well: eco's computation block entities declare LDLib's sync-data interfaces in
    // their supertype list, so extending one (our computation drive) cannot compile without it.
    compileOnly fg.deobf("curse.maven:ldlib-626676:7809449")
    runtimeOnly fg.deobf("curse.maven:ldlib-626676:7809449")

    // Applied Mekanistics, plus the Mekanism it hard-requires, so the chemical matrix family can be
    // developed and actually seen working. Both coordinates were already resolved on this machine by
    // eco's own pom. Read from their mods.toml before being added: appmek needs forge [47.0.0,48.0.0)
    // (we are on 47.4.20), mekanism [10.4.0,11.0.0) (this is 10.4.16.80) and ae2 as an optional
    // [15.0.0,16.0.0) (15.4.10); Mekanism itself requires only minecraft 1.20.1 and forge [47.1.1,).
    // Nothing in our jar may load these unless the mod is present - see Prototype1201's gate.
    compileOnly fg.deobf("mekanism:Mekanism:1.20.1-10.4.16.80")
    runtimeOnly fg.deobf("mekanism:Mekanism:1.20.1-10.4.16.80")
    compileOnly fg.deobf("curse.maven:applied-mekanistics-574300:7244744")
    runtimeOnly fg.deobf("curse.maven:applied-mekanistics-574300:7244744")

    // AppliedFlux. The FE cell family itself needs nothing here - it extends eco's own
    // ECOFeStorageCellItem and reads FluxKeyType inside a constructor body - but the induction-card
    // allowance does: AFItemAndBlock.INDUCTION_CARD is a field read, therefore a must-resolve reference,
    // so the type has to be compilable even though the branch only runs with the mod loaded.
    // runtimeOnly as well, with Glodium declared next to it: appflux's own mods.toml makes
    // glodium [1.0,) mandatory, so listing appflux alone buys a missing-dependency screen instead of a
    // dev client. Neither line reaches the shipped jar and neither moves the floor - the family stays
    // optional. Dropping the published jars into run/mods is *not* the same route: they carry SRG names,
    // the dev client runs the 'official' channel, and fg.deobf is what makes them load (measured here on
    // JEI, where the raw jar threw NoSuchMethodError on Component.m_237110_).
    compileOnly fg.deobf("curse.maven:applied-flux-965012:7651647")
    runtimeOnly fg.deobf("curse.maven:applied-flux-965012:7651647")
    // Glodium, pinned by file rather than by version: Modrinth's maven layout resolves a version to one
    // arbitrary file of that name. This is the CDN path data/UhW5uCKw/versions/eoUaDkZf, sha1
    // c7534db3248adfcf39a6158b423dfc9bfc99a378 - the same 60 550 B jar the shelf copy under 参考模组/ is.
    runtimeOnly fg.deobf("UhW5uCKw:Glodium-1.20-1.5-forge:eoUaDkZf")

    // AE2 OmniCells is deliberately NOT a dependency of this line. Its cells would have to extend eco's
    // omni adapter, whose own superclass is OmniCells' AEUniversalCellItem, and Forge 1.20.1's
    // EventSubclassTransformer force-loads every class in our jar while building event handlers - so a
    // parent-chain reference crashes the boot on any pack without the mod, no gate being close enough
    // (measured: FATAL ClassNotFoundException com/wintercogs/ae2omnicells/common/items/AEUniversalCellItem
    // before our own code ran). Eco 20.5.3 also declares the optional dependency as [1.1.6,), while the
    // 1.20.1 build of OmniCells is 1.0.7, so even installing it makes FML refuse to start. The family is
    // therefore not shipped here; the deleted sources are kept byte-identical under _removed_sources/.

    // Jade: the same coordinate and version eco's optional integration compiles against.
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")

    // JEI for the dev runs, so a ported recipe can actually be looked up.
    // fg.deobf is not optional: the dev client runs on the 'official' name channel while the
    // published jar calls SRG names, so dropping it into run/mods booted NoSuchMethodError on
    // Component.m_237110_. 15.59.0.212 is the newest 1.20.1 forge file that declares no
    // dependency at all - 15.74 needs MezzConfig, whose only maven-channel copy is the 1.19.2
    // build. runtimeOnly only: nothing compiles against JEI and none of this enters our jar,
    // so players are never asked to install it.
    // compileOnly as well now that the JEI plugin under integration/jei compiles against it.
    compileOnly fg.deobf("u6dRKJwZ:jei-1.20.1-forge-15.59.0.212:IrfJO7PN")
    runtimeOnly fg.deobf("u6dRKJwZ:jei-1.20.1-forge-15.59.0.212:IrfJO7PN")

}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                // Forge 1.20.1 has no mods.toml key for mixin configs (IModInfo exposes no accessor for
                // one and fmlloader contains no "mixin" string at all). The loader path is the jar manifest
                // attribute, read by mixin's own MixinPlatformAgentDefault - which is how eco 20.5.3 ships
                // its nine configs. Dev runs load classes, not this jar, so runs below pass --mixin.config
                // instead; both are needed or the same code behaves differently in dev and in a release.
                'MixinConfigs'          : 'neoecoprototype1201.mixins.json'
        ])
    }
}

processResources {
    // One place for the version number. mods.toml reads ${mod_version} and this fills it from
    // gradle.properties, so a bump cannot leave the jar named 0.2.0 while its own metadata still says
    // 0.1.0 - which is what FML shows in the "mod requires..." screen and in the Mods list. Checked
    // after every build by reading META-INF/mods.toml back out of the produced jar.
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': project.mod_version
    }
}
