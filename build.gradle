plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

// Porting aid: javac's default 100-error ceiling hides the rest of the gap list, so progress
// between compile runs cannot be measured.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

base {
    archivesName = 'neoecoprototype1201'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
        // Modrinth publishes bare jars with no POM; without artifact() the original never
        // resolves, and ForgeGradle then cannot produce the _mapped_official_ variant.
        metadataSources {
            mavenPom()
            artifact()
        }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Published mods carry SRG-named refmaps; the dev environment runs on official names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            // Dev runs put our classes on the classpath instead of loading this project's jar, so the
            // MixinConfigs manifest attribute above is never read here. Mixin's own command line option
            // reaches the same registration - MixinPlatformManager.prepare() calls Mixins.addConfiguration()
            // for every --mixin.config value it finds on sun.java.command.
            args '--mixin.config', 'neoecoprototype1201.mixins.json'
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // eco's published 1.20.1 build. It is reobfuscated for production, so it needs the same
    // fg.deobf trip as every other mod here to line up with the 'official' mappings channel above.
    implementation fg.deobf("maven.modrinth:neoecoae:${eco_version}")

    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")

    compileOnly("org.appliedenergistics:guideme:${guideme_version}:api")
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    // eco's mods.toml makes LDLib v1 mandatory. Registrate does not belong here: the published eco
    // jar already carries its own copy via jarJar (MC1.20-1.3.11), and a second one on the module
    // path is a duplicate-package ResolutionException at boot.
    // compileOnly as well: eco's computation block entities declare LDLib's sync-data interfaces in
    // their supertype list, so extending one (our computation drive) cannot compile without it.
    compileOnly fg.deobf("curse.maven:ldlib-626676:7809449")
    runtimeOnly fg.deobf("curse.maven:ldlib-626676:7809449")

    // Jade: the same coordinate and version eco's optional integration compiles against.
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                // Forge 1.20.1 has no mods.toml key for mixin configs (IModInfo exposes no accessor for
                // one and fmlloader contains no "mixin" string at all). The loader path is the jar manifest
                // attribute, read by mixin's own MixinPlatformAgentDefault - which is how eco 20.5.3 ships
                // its nine configs. Dev runs load classes, not this jar, so runs below pass --mixin.config
                // instead; both are needed or the same code behaves differently in dev and in a release.
                'MixinConfigs'          : 'neoecoprototype1201.mixins.json'
        ])
    }
}
