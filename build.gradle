plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

// Porting aid: javac's default 100-error ceiling hides the rest of the gap list, so progress
// between compile runs cannot be measured.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

base {
    archivesName = 'neoecoprototype1201'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Tterrag'
        url = 'https://maven.tterrag.com/'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
        // Modrinth publishes bare jars with no POM; without artifact() the original never
        // resolves, and ForgeGradle then cannot produce the _mapped_official_ variant.
        metadataSources {
            mavenPom()
            artifact()
        }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Published mods carry SRG-named refmaps; the dev environment runs on official names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Our own build of eco's 1.20.1 branch, in official names (not the reobfuscated release jar),
    // so it lines up with the 'official' mappings channel used above.
    implementation files('libs/neoecoae-20.5.0.jar')

    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")

    compileOnly("org.appliedenergistics:guideme:${guideme_version}:api")
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    // eco's mods.toml makes LDLib v1 mandatory; Registrate is normally embedded by upstream's
    // jarJar step, which our plain 'jar' build skips.
    runtimeOnly fg.deobf("curse.maven:ldlib-626676:7809449")
    // eco's NEClusterCalculator exposes Registrate types in its public signatures, so compiling
    // against it needs that jar on the compile classpath as well.
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
    runtimeOnly fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
    runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.1.106")

    // Jade: the same coordinate and version eco's optional integration compiles against.
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version
        ])
    }
}
